[package]
name = "mantle-replay"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "mantle-replay"
path = "src/main.rs"

[[bin]]
name = "discover-peers"
path = "src/discover_peers.rs"

[[bin]]
name = "rank-peers"
path = "src/rank_peers.rs"

[[bin]]
name = "fetch-blocks"
path = "src/fetch_blocks.rs"

[lib]
name = "mantle_replay"
path = "src/lib.rs"

[dependencies]
mantle = { path = "../crates/mantle" }
mantle-block-io = { path = "../crates/block-io" }
mantle-consensus = { path = "../crates/consensus" }
mantle-fetcher = { path = "../crates/fetcher" }
mantle-storage = { path = "../crates/storage" }
mantle-transport = { path = "../crates/transport" }
mantle-utxo-hash = { path = "../crates/utxo-hash" }
mantle-validator = { path = "../crates/validator" }
ququmatz.workspace = true
quetzalcoatl.workspace = true
pprof = { version = "0.14", optional = true }

[features]
cpu-profile = ["dep:pprof"]
