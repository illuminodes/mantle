[workspace]
resolver = "3"
members = [
    "crates/mantle",
    "crates/consensus",
    "crates/storage",
    "crates/validator",
    "crates/transport",
    "crates/block-io",
    "crates/fetcher",
    "crates/utxo-set",
    "crates/bloom",
    "crates/lru-cache",
    "bench",
    "conformance",
    "replay",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.lints.clippy]
all = "warn"
perf = "warn"
pedantic = "warn"
style = "warn"

# cargo-fuzz requires debug info in release builds to get useful stack traces.
[profile.release]
debug = true

[workspace.dependencies]
sha2 = "0.11"
sha1 = "0.11"
ripemd = "0.2"
k256 = { version = "0.14", default-features = false }
bitcoinconsensus = "0.106.0"
ququmatz = { path = "/home/cuarentaydos/Code/tooling/ququmatz" }
quetzalcoatl = { path = "/home/cuarentaydos/Code/tooling/quetzalcoatl" }

[patch.crates-io]
quetzalcoatl = { path = "/home/cuarentaydos/Code/tooling/quetzalcoatl" }
