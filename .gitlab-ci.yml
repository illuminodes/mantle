stages:
  - verify

variables:
  CARGO_TARGET_DIR: "$CI_PROJECT_DIR/target"
  VERIFY_DIR: "$CI_PROJECT_DIR/verify-run"
  VERIFY_STOP_HEIGHT: ""
  VERIFY_WINDOW: "1000"
  VERIFY_PROGRESS_SECS: "300"

full-chain-verify:
  stage: verify
  tags:
    - ansible
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "full-chain-verify"'
  timeout: 7d
  resource_group: full-chain-verify
  interruptible: true
  before_script:
    - export PATH="$HOME/.cargo/bin:$PATH"
    - pkill -f '/42pupusas/mantle/target/.*/mantle-replay' && sleep 5 || true
    - command -v cargo >/dev/null || curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
    - test "$(cat /proc/sys/kernel/io_uring_disabled)" != 2 || { echo "io_uring is disabled on this host"; exit 1; }
    - rm -rf "$VERIFY_DIR" && mkdir -p "$VERIFY_DIR"
  script:
    - set -o pipefail
    - RUSTFLAGS="-C target-cpu=native" cargo build --profile replay -p mantle-replay --bins
    - BIN="$CARGO_TARGET_DIR/replay"
    - $BIN/discover-peers --network mainnet --seconds 90 --out "$VERIFY_DIR/peers.raw.txt"
    - $BIN/rank-peers --network mainnet --peer-file "$VERIFY_DIR/peers.raw.txt" --top 128 --out "$VERIFY_DIR/peers.txt"
    - STOP_ARGS=""; [ -n "$VERIFY_STOP_HEIGHT" ] && STOP_ARGS="--stop-height $VERIFY_STOP_HEIGHT"
    - >
      $BIN/mantle-replay
      --network mainnet
      --data-dir "$VERIFY_DIR/chain"
      --peer-file "$VERIFY_DIR/peers.txt"
      --ephemeral
      --keep-going
      --failures-file "$VERIFY_DIR/failures.tsv"
      --failure-blocks-dir "$VERIFY_DIR/failed-blocks"
      --window "$VERIFY_WINDOW"
      --progress-secs "$VERIFY_PROGRESS_SECS"
      $STOP_ARGS
      2>&1 | tee "$VERIFY_DIR/replay.log"
      | grep --line-buffered -E 'replaying|got [0-9]+ headers|at tip|treating as tip|CONSENSUS FAILURE|^ *\[ *[0-9]+/|fatal|complete|consensus failures|^  (structure|context|connect) |removed ephemeral|saved failing block'
  after_script:
    - pkill -f "$CI_PROJECT_DIR/target/.*/mantle-replay" || true
    - rm -rf "$CI_PROJECT_DIR/verify-run/chain"
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - verify-run/failures.tsv
      - verify-run/replay.log
      - verify-run/failed-blocks/
