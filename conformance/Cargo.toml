[package]
name = "mantle-conformance"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

# Test infrastructure only, and the only crate that links Bitcoin Core's
# libbitcoinconsensus, as an oracle to compare against. It must never be a
# [dependency] of a node crate — only a [dev-dependency] of bench, or a
# dependency of the out-of-workspace fuzz crate.
[dependencies]
bitcoinconsensus = "0.106.0"
mantle = { path = "../crates/mantle" }
mantle-consensus = { path = "../crates/consensus" }
proptest = "1"
k256 = { workspace = true, features = ["ecdsa", "schnorr", "arithmetic"] }
sha2 = { workspace = true }
ripemd = { workspace = true }

[dev-dependencies]
serde_json = "1"

[[test]]
name = "bip_vectors"
path = "tests/bip_vectors/mod.rs"

[[test]]
name = "proptest"
path = "tests/proptest.rs"

[[test]]
name = "script_assets"
path = "tests/script_assets/main.rs"
